<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EC Harness | カゴ落ち回収・ステップ配信CRMダッシュボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-20 px-6 py-4 flex items-center justify-between">
    <div>
      <span class="text-xs font-bold text-emerald-400 tracking-widest uppercase">Zero-Cost D2C CRM Engine</span>
      <h1 class="text-xl font-bold text-white" id="store-title">EC Harness Dashboard</h1>
    </div>
    <button onclick="simulateAbandonedCart()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow">
      ＋ テストカゴ落ちWebhookを送信
    </button>
  </header>

  <main class="max-w-6xl mx-auto p-6 space-y-6">
    <!-- KPIs -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <p class="text-xs text-slate-400">未回収カゴ落ち件数</p>
        <p class="text-3xl font-bold text-amber-400 mt-1" id="kpi-abandoned-count">0件</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <p class="text-xs text-slate-400">回収見込み売上（機会損失）</p>
        <p class="text-3xl font-bold text-amber-300 mt-1" id="kpi-recoverable-rev">¥0</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <p class="text-xs text-slate-400">リカバリー成功件数</p>
        <p class="text-3xl font-bold text-emerald-400 mt-1" id="kpi-recovered-count">0件</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <p class="text-xs text-slate-400">リカバリー回収済み売上</p>
        <p class="text-3xl font-bold text-emerald-300 mt-1" id="kpi-recovered-rev">¥0</p>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Abandoned Carts Table -->
      <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <h2 class="font-bold text-base mb-4 flex items-center justify-between">
          <span>🛒 カゴ落ち・チェックアウト監視リスト</span>
          <span class="text-xs text-slate-400 font-normal">LINE / Resend 自動追客</span>
        </h2>
        <div id="checkouts-list" class="space-y-3"></div>
      </div>

      <!-- RFM Segmentation -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <h2 class="font-bold text-base mb-4">💎 顧客RFMセグメント分析</h2>
        <div id="segments-list" class="space-y-3"></div>
      </div>
    </div>
  </main>

  <script>
    async function loadDashboard() {
      const res = await fetch('/api/dashboard');
      const data = await res.json();

      document.getElementById('kpi-abandoned-count').innerText = `${data.kpis.abandoned_count}件`;
      document.getElementById('kpi-recoverable-rev').innerText = `¥${data.kpis.recoverable_revenue.toLocaleString()}`;
      document.getElementById('kpi-recovered-count').innerText = `${data.kpis.recovered_count}件`;
      document.getElementById('kpi-recovered-rev').innerText = `¥${data.kpis.recovered_revenue.toLocaleString()}`;

      const cList = document.getElementById('checkouts-list');
      cList.innerHTML = data.checkouts.map(ch => `
        <div class="p-4 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between">
          <div>
            <div class="flex items-center space-x-2">
              <span class="font-bold text-sm text-white">${ch.customer_name}</span>
              <span class="text-xs px-2 py-0.5 rounded-full ${ch.status === 'abandoned' ? 'bg-amber-500/20 text-amber-300' : 'bg-emerald-500/20 text-emerald-300'}">${ch.status}</span>
            </div>
            <p class="text-xs text-slate-400 mt-1">カート金額: <strong class="text-slate-200">¥${ch.total_price.toLocaleString()}</strong> | 通知: ${ch.recovery_sent_at ? '送信済み' : '未送信'}</p>
          </div>
          <div class="flex space-x-2">
            ${ch.status === 'abandoned' ? `
              <button onclick="triggerRecovery('${ch.id}')" class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg">クーポン追客送信</button>
              <button onclick="simulatePurchase('${ch.id}', ${ch.total_price})" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg">購入完了テスト</button>
            ` : ''}
          </div>
        </div>
      `).join('');

      const sList = document.getElementById('segments-list');
      sList.innerHTML = data.segments.map(seg => `
        <div class="p-3.5 rounded-xl bg-slate-950 border border-slate-800 flex justify-between items-center">
          <div>
            <span class="text-xs uppercase font-bold text-emerald-400">${seg.rfm_segment}</span>
            <p class="text-xs text-slate-400 mt-0.5">顧客数: ${seg.count}名</p>
          </div>
          <span class="text-sm font-bold text-white">¥${seg.revenue.toLocaleString()}</span>
        </div>
      `).join('');
    }

    async function triggerRecovery(id) {
      await fetch(`/api/recover/${id}`, { method: 'POST' });
      await loadDashboard();
    }

    async function simulatePurchase(checkoutId, price) {
      await fetch('/api/webhooks/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ checkout_id: checkoutId, total_price: price })
      });
      await loadDashboard();
    }

    async function simulateAbandonedCart() {
      await fetch('/api/webhooks/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          customer_name: '伊藤 さくら',
          customer_email: `ito_${Date.now()}@example.com`,
          total_price: 12400,
          status: 'abandoned'
        })
      });
      await loadDashboard();
    }

    loadDashboard();
  </script>
</body>
</html>
